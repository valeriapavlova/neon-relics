<title>Neon Relics Capsule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: brand canvas (cool grey) + dark "vitrine" panels for imagery; staggered 4-look grid → look page → capsule archive */
:root{
  --bg:#D8DFE6; --bg-soft:#DEE3E9; --ink:#0F1821; --muted:#5E646B;
  --red:#CC230F; --red-dark:#A41F10; --red-soft:#E08C82;
  --vitrine:#0B1118; --vitrine-line:rgba(216,223,230,.14); --on-vitrine:#D8DFE6;
  --line:rgba(15,24,33,.16);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Jost","Helvetica Neue",Arial,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 var(--s9)}
img{max-width:100%;display:block}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1312px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-transform:uppercase;line-height:.98;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.lead{font-size:15px;text-transform:uppercase;letter-spacing:.02em;max-width:46ch}

/* Prototype note */
.proto{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);align-items:center;justify-content:space-between;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:var(--s2);border-bottom:1px solid var(--line)}
.proto b{color:var(--red);font-weight:600}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding-block:var(--s4)}
.logo{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.nav{display:flex;gap:var(--s5);align-items:center}
.nav a{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);text-decoration:none;padding-block:var(--s2)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom:1px solid var(--ink)}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bg);
  font-size:11px;margin-left:6px;padding-inline:6px;font-variant-numeric:tabular-nums;transition:transform .3s}
.count.bump{transform:scale(1.35)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:14px 20px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn:hover{background:var(--red);border-color:var(--red)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn--on{background:transparent;color:var(--on-vitrine);border-color:var(--vitrine-line)}
.btn--on:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn--kept{background:var(--red);border-color:var(--red);color:#fff}
.btn--kept:hover{background:var(--red-dark);border-color:var(--red-dark)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);background:transparent;cursor:pointer}
.icon-btn:hover:not(:disabled){border-color:var(--ink)}
.icon-btn:disabled{opacity:.3;cursor:default}

/* ===== Collection ===== */
.coll-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:var(--s6);align-items:end;padding-block:var(--s8) var(--s7)}
.coll-head h1{font-size:clamp(40px,7vw,104px);color:var(--red)}
.looks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s6) var(--s5);align-items:start}
.look-card{display:flex;flex-direction:column;gap:var(--s3);text-decoration:none;color:inherit}
.looks .look-card:nth-child(2){margin-top:var(--s9)}
.looks .look-card:nth-child(3){margin-top:var(--s6)}
.looks .look-card:nth-child(4){margin-top:calc(var(--s9) + var(--s7))}
.lc-meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.lc-meta span:last-child{color:var(--muted)}
.lc-img{position:relative;background:var(--vitrine);aspect-ratio:3/4;overflow:hidden}
.lc-img img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .4s}
.look-card:hover .lc-img > img{transform:scale(1.04);opacity:.55}
.lc-pieces{position:absolute;inset:auto 0 0 0;display:flex;gap:var(--s2);padding:var(--s3);opacity:0;transform:translateY(8px);transition:.4s}
.look-card:hover .lc-pieces,.look-card:focus-visible .lc-pieces{opacity:1;transform:none}
.lc-pieces img{width:56px;height:56px;object-fit:contain;background:rgba(216,223,230,.1);border:1px solid var(--vitrine-line);padding:4px}
.lc-name{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3)}
.lc-name h2{font-size:15px}
.lc-name .arrow{font-size:20px;line-height:1;transition:transform .3s}
.look-card:hover .arrow{transform:translateX(4px)}
.lc-line{font-size:14px;color:var(--muted);max-width:32ch}

/* ===== Look page ===== */
.back{display:inline-flex;gap:var(--s2);margin-block:var(--s5);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);text-decoration:none}
.look{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:var(--s7);align-items:start}
.look-portrait{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--vitrine);aspect-ratio:3/4;overflow:hidden}
.look-portrait img{width:100%;height:100%;object-fit:cover}
.look-portrait .num{position:absolute;left:var(--s4);top:var(--s4);color:var(--on-vitrine);font-size:12px;letter-spacing:.12em}
.look-info{display:flex;flex-direction:column;gap:var(--s5);padding-top:var(--s5)}
.look-info h1{font-size:clamp(36px,5.4vw,80px);color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2)}
.tag{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--muted)}
.story{font-size:15px;text-transform:uppercase;letter-spacing:.02em;max-width:52ch}
.pieces{display:flex;flex-direction:column;background:var(--vitrine);color:var(--on-vitrine);margin-top:var(--s3)}
.pieces-head{display:flex;justify-content:space-between;align-items:baseline;padding:var(--s5) var(--s5) var(--s3);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.piece{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:var(--s5);align-items:center;padding:var(--s5);border-top:1px solid var(--vitrine-line)}
.piece-img{aspect-ratio:1;display:grid;place-items:center;background:rgba(216,223,230,.05)}
.piece-img img{max-height:100px;object-fit:contain}
.piece h3{font-size:14px;margin-bottom:var(--s2)}
.piece p{margin:0;font-size:14px;color:rgba(216,223,230,.7);max-width:40ch}
.piece .spec{display:flex;gap:var(--s4);margin-top:var(--s3);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(216,223,230,.55)}
.piece .price{font-size:16px;color:var(--on-vitrine);letter-spacing:0;font-variant-numeric:tabular-nums}
.piece-action{display:flex;flex-direction:column;align-items:flex-end;gap:var(--s3)}
.look-cta{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;justify-content:space-between;padding:var(--s5);border-top:1px solid var(--vitrine-line)}
.look-cta small{font-size:13px;color:rgba(216,223,230,.6)}
.look-nav{display:flex;justify-content:space-between;gap:var(--s4);margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--line)}
.look-nav a{color:var(--ink);text-decoration:none;display:flex;flex-direction:column;gap:var(--s1)}
.look-nav a span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.look-nav a b{font-family:var(--f-display);font-weight:500;font-size:14px;text-transform:uppercase}
.look-nav a:last-child{text-align:right}

/* ===== Capsule ===== */
.cap-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:var(--s6);align-items:end;padding-block:var(--s8) var(--s6)}
.cap-head h1{font-size:clamp(40px,7vw,104px);color:var(--red)}
.cap-head p{margin:0 0 var(--s3);font-size:15px;max-width:44ch}
.cap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:var(--s6);align-items:start}
.archive{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.entry{display:grid;grid-template-columns:28px 32px 96px minmax(0,1fr) auto;gap:var(--s4);align-items:center;padding-block:var(--s4);border-bottom:1px solid var(--line);background:var(--bg);transition:background .2s}
.entry.dragging{opacity:.4}
.entry.over{box-shadow:inset 0 2px 0 var(--red)}
.entry .idx{font-family:var(--f-display);font-size:13px;color:var(--red);font-variant-numeric:tabular-nums}
.handle{cursor:grab;color:var(--muted);font-size:18px;line-height:1;user-select:none;text-align:center}
.entry-img{aspect-ratio:1;background:var(--vitrine);display:grid;place-items:center;padding:6px}
.entry-img img{max-height:80px;object-fit:contain}
.entry h3{font-size:14px}
.entry .from{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:var(--s1)}
.entry textarea{margin-top:var(--s2);width:100%;max-width:48ch;min-height:0;resize:none;border:0;border-bottom:1px dashed var(--line);background:transparent;padding:4px 0;font-size:14px;line-height:1.4}
.entry textarea::placeholder{color:var(--muted);font-style:italic}
.entry textarea:focus{outline:none;border-bottom-color:var(--red)}
.entry-ctrl{display:flex;gap:var(--s2);align-items:center}
.entry .price{font-variant-numeric:tabular-nums;font-size:15px;min-width:72px;text-align:right}
.remove{background:none;border:0;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.remove:hover{color:var(--red)}
.undo{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.undo button{background:none;border:0;color:var(--red);cursor:pointer;text-transform:uppercase;font-size:12px;letter-spacing:.08em;text-decoration:underline}
.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--vitrine);color:var(--on-vitrine);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.ledger h2{font-size:18px}
.ledger dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:var(--s2) var(--s4);font-size:14px}
.ledger dt{color:rgba(216,223,230,.6)}
.ledger dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.ledger dd.total{font-family:var(--f-display);font-size:20px}
.ledger hr{border:0;border-top:1px solid var(--vitrine-line);margin:0;grid-column:1/-1}
.ledger p{margin:0;font-size:13px;color:rgba(216,223,230,.65)}
.ledger .btn{width:100%}
.ledger form{display:flex;flex-direction:column;gap:var(--s3)}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(216,223,230,.6)}
.field input{background:transparent;border:0;border-bottom:1px solid var(--vitrine-line);color:var(--on-vitrine);padding:8px 0}
.field input:focus{outline:none;border-bottom-color:var(--red-soft)}
.field .err{font-size:12px;color:var(--red-soft)}
.sealed{border:1px solid var(--red);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
.sealed b{font-family:var(--f-display);font-weight:500;text-transform:uppercase;font-size:14px;color:var(--red-soft)}
.empty{grid-column:1/-1;border:1px dashed var(--ink);padding:var(--s8) var(--s5);display:flex;flex-direction:column;align-items:center;gap:var(--s4);text-align:center}
.empty h2{font-size:22px}
.empty p{margin:0;max-width:40ch;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);
  padding:12px 20px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;transition:.3s;z-index:20;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.view{animation:in .5s ease both}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1024px){
  .looks{grid-template-columns:repeat(2,minmax(0,1fr))}
  .looks .look-card:nth-child(3){margin-top:0}
  .looks .look-card:nth-child(4){margin-top:var(--s9)}
  .cap{grid-template-columns:1fr}
  .ledger{position:static}
}
@media (max-width:760px){
  .coll-head,.cap-head,.look{grid-template-columns:1fr}
  .look-portrait{position:static}
  .piece{grid-template-columns:88px minmax(0,1fr)}
  .piece-action{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .entry{grid-template-columns:24px 72px minmax(0,1fr);grid-template-areas:"idx img txt" "ctrl ctrl ctrl"}
  .entry .handle{display:none}
  .entry .idx{grid-area:idx}.entry .entry-img{grid-area:img}.entry .entry-txt{grid-area:txt}
  .entry .entry-ctrl{grid-area:ctrl;justify-content:space-between}
}
@media (max-width:480px){
  .looks{grid-template-columns:1fr}
  .looks .look-card:nth-child(n){margin-top:0}
  .nav{gap:var(--s4)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <div class="proto"><span><b>Prototype</b> · capsule concept for Neon Relics</span><span>Images are placeholders until the new characters are ready</span></div>

    <a class="logo" href="#collection">NEON<br>RELICS</a>
    <nav class="nav" aria-label="Main">
      <a href="#collection" data-nav="collection">Collection</a>
      <a href="#capsule" data-nav="capsule">Capsule<span class="count" id="count" aria-label="relics in capsule">0</span></a>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- Capsule state ---------- */
const KEY = "neon-relics-capsule-v1";
let capsule;   // [{id, note}]
let removed = null; // {item, index} for undo
let sealed = null;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) { capsule = JSON.parse(raw); return; } } catch(e) {}
  capsule = [ {id:"dominion-collar", note:"For the days I need to be heard first."}, {id:"halo-hoop", note:""} ]; // example state
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(capsule)); } catch(e) {} }
const inCapsule = id => capsule.some(x => x.id === id);
function add(id){ if (!inCapsule(id)) { capsule.push({id, note:""}); sealed = null; changed(`${PIECES[id].name} kept in your capsule`); } }
function remove(id){
  const i = capsule.findIndex(x => x.id === id); if (i < 0) return;
  removed = { item: capsule[i], index: i }; capsule.splice(i, 1); sealed = null;
  changed(`${PIECES[id].name} released`);
}
function move(from, to){
  if (to < 0 || to >= capsule.length || from === to) return;
  const [it] = capsule.splice(from, 1); capsule.splice(to, 0, it); changed();
}
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }
function changed(msg){
  save(); const c = $("#count"); c.textContent = capsule.length; c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");
  if (msg) toast(msg); render(false);
}

/* ---------- Views ---------- */
function viewCollection(){
  const total = Object.keys(PIECES).length;
  return `
  <section class="view">
    <div class="coll-head">
      <h1>Four looks,<br>${["zero","one","two","three","four","five","six","seven","eight","nine","ten"][total] || total} relics</h1>
      <p class="lead">Each look is a character. Each character wears one to three pieces. Choose who you are tonight, then keep only what resonates.</p>
    </div>
    <div class="looks">
      ${LOOKS.map(l => `
        <a class="look-card" href="#look-${l.id}">
          <div class="lc-meta"><span>Look ${l.n}</span><span>${l.pieces.length} ${l.pieces.length > 1 ? "relics" : "relic"}</span></div>
          <div class="lc-img">
            <img src="${IMG[l.img]}" alt="${esc(l.character)}, wearing the ${esc(l.name)} look" loading="lazy">
            <div class="lc-pieces">${l.pieces.map(p => `<img src="${IMG[PIECES[p].img]}" alt="">`).join("")}</div>
          </div>
          <div class="lc-name"><h2>${l.name}</h2><span class="arrow" aria-hidden="true">→</span></div>
          <p class="lc-line">${l.character}. ${l.line}</p>
        </a>`).join("")}
    </div>
  </section>`;
}

function viewLook(id){
  const i = LOOKS.findIndex(l => l.id === id); if (i < 0) return viewCollection();
  const l = LOOKS[i], prev = LOOKS[(i + 3) % 4], next = LOOKS[(i + 1) % 4];
  const kept = l.pieces.filter(inCapsule).length, all = kept === l.pieces.length;
  const lookTotal = l.pieces.reduce((s, p) => s + PIECES[p].price, 0);
  return `
  <section class="view">
    <a class="back" href="#collection">← All looks</a>
    <div class="look">
      <div class="look-portrait"><img src="${IMG[l.img]}" alt="${esc(l.character)}, wearing the ${esc(l.name)} look"><span class="num">LOOK ${l.n} / 04</span></div>
      <div class="look-info">
        <span class="eyebrow">${l.character}</span>
        <h1>${l.name}</h1>
        <div class="tags">${l.mood.map(m => `<span class="tag">${m}</span>`).join("")}</div>
        <p class="story">${l.story}</p>
        <div class="pieces">
          <div class="pieces-head"><span>Worn in this look</span><span>${kept} / ${l.pieces.length} in your capsule</span></div>
          ${l.pieces.map(pid => { const p = PIECES[pid], k = inCapsule(pid); return `
            <article class="piece">
              <div class="piece-img"><img src="${IMG[p.img]}" alt="${esc(p.name)}"></div>
              <div>
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <div class="spec"><span>${p.material}</span><span>${p.edition}</span></div>
              </div>
              <div class="piece-action">
                <span class="price">${eur(p.price)}</span>
                <button class="btn ${k ? "btn--kept" : "btn--on"}" data-toggle="${pid}" aria-pressed="${k}">${k ? "In capsule ✓" : "Keep in capsule"}</button>
              </div>
            </article>`; }).join("")}
          ${l.pieces.length > 1 ? `
          <div class="look-cta">
            <small>The full look · ${eur(lookTotal)}</small>
            <button class="btn btn--on" data-all="${l.id}" ${all ? "disabled" : ""}>${all ? "Whole look kept" : "Keep the whole look"}</button>
          </div>` : ""}
        </div>
        <nav class="look-nav" aria-label="Other looks">
          <a href="#look-${prev.id}"><span>← Look ${prev.n}</span><b>${prev.name}</b></a>
          <a href="#look-${next.id}"><span>Look ${next.n} →</span><b>${next.name}</b></a>
        </nav>
      </div>
    </div>
  </section>`;
}

function viewCapsule(){
  const total = capsule.reduce((s, x) => s + PIECES[x.id].price, 0);
  const looks = new Set(capsule.map(x => PIECES[x.id].look)).size;
  const undo = removed ? `<div class="undo"><span>${PIECES[removed.item.id].name} released from your capsule.</span><button data-undo>Undo</button></div>` : "";
  const head = `
    <div class="cap-head">
      <h1>Your<br>capsule</h1>
      <p>Instead of a classic cart, each selection is kept in your capsule: an intimate inventory of pieces that resonate with you. Add, remove, reorder. You are not buying impulses; you are curating a small archive of power.</p>
    </div>`;
  if (!capsule.length) return `<section class="view">${head}<div class="cap">${undo ? `<div style="grid-column:1/-1">${undo}</div>` : ""}
    <div class="empty"><h2>The archive is empty</h2><p>Open a look and keep the pieces that speak for you. They will wait here, in the order you choose.</p><a class="btn" href="#collection">See the four looks</a></div></div></section>`;
  return `
  <section class="view">${head}
    <div class="cap">
      <div>
        <ol class="archive" id="archive" aria-label="Capsule, in your order">
          ${capsule.map((x, i) => { const p = PIECES[x.id], l = LOOKS.find(l => l.id === p.look); return `
          <li class="entry" draggable="true" data-i="${i}">
            <span class="handle" aria-hidden="true" title="Drag to reorder">⋮⋮</span>
            <span class="idx">${String(i + 1).padStart(2, "0")}</span>
            <div class="entry-img"><img src="${IMG[p.img]}" alt="${esc(p.name)}"></div>
            <div class="entry-txt">
              <h3>${p.name}</h3>
              <div class="from">From ${l.name} · ${p.edition}</div>
              <textarea id="note-${x.id}" rows="1" data-note="${x.id}" aria-label="Why ${esc(p.name)} resonates with you" placeholder="Why it resonates…">${esc(x.note)}</textarea>
            </div>
            <div class="entry-ctrl">
              <button class="icon-btn" data-move="${i}" data-dir="-1" ${i === 0 ? "disabled" : ""} aria-label="Move ${esc(p.name)} up">↑</button>
              <button class="icon-btn" data-move="${i}" data-dir="1" ${i === capsule.length - 1 ? "disabled" : ""} aria-label="Move ${esc(p.name)} down">↓</button>
              <span class="price">${eur(p.price)}</span>
              <button class="remove" data-remove="${x.id}">Release</button>
            </div>
          </li>`; }).join("")}
        </ol>
        ${undo}
      </div>
      <aside class="ledger" aria-label="Capsule summary">
        <h2>The archive</h2>
        <dl>
          <dt>Relics kept</dt><dd>${capsule.length} of ${Object.keys(PIECES).length}</dd>
          <dt>Looks represented</dt><dd>${looks} of 4</dd>
          <hr>
          <dt>Value of the capsule</dt><dd class="total">${eur(total)}</dd>
        </dl>
        ${sealed ? `
          <div class="sealed" role="status"><b>Capsule sealed</b><span>${esc(sealed.name)}, your ${capsule.length} relics are set aside under your name. In the real atelier, an invitation to a private viewing would follow.</span></div>
          <button class="btn btn--on" data-reopen>Open the capsule again</button>` : `
          <p>Relics are not sold on impulse. Seal your capsule to request a private viewing, where each piece is fitted in person.</p>
          <form id="seal" novalidate>
            <div class="field"><label for="seal-name">Name</label><input id="seal-name" autocomplete="name" required><span class="err" hidden>Add your name so we know who to expect.</span></div>
            <div class="field"><label for="seal-email">Email</label><input id="seal-email" type="email" autocomplete="email" required><span class="err" hidden>Use an email like name@domain.com.</span></div>
            <button class="btn btn--kept" type="submit">Seal my capsule</button>
          </form>`}
      </aside>
    </div>
  </section>`;
}

/* ---------- Router ---------- */
function route(){ const h = location.hash.slice(1); return h || "collection"; }
function render(scroll = true){
  const r = route(); const app = $("#app");
  const y = scrollY;
  app.innerHTML = r === "capsule" ? viewCapsule() : r.startsWith("look-") ? viewLook(r.slice(5)) : viewCollection();
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", false));
  const nav = $(`[data-nav="${r === "capsule" ? "capsule" : "collection"}"]`); if (nav) nav.setAttribute("aria-current", "page");
  if (scroll) window.scrollTo(0, 0); else window.scrollTo(0, y);
  if (!scroll) app.querySelectorAll(".view").forEach(v => v.style.animation = "none");
  bindDrag(); autosize();
}
function autosize(){ document.querySelectorAll("textarea[data-note]").forEach(t => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }); }

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.toggle) { const id = t.dataset.toggle; inCapsule(id) ? remove(id) : add(id); }
  else if (t.dataset.all) { LOOKS.find(l => l.id === t.dataset.all).pieces.forEach(p => { if (!inCapsule(p)) capsule.push({id:p, note:""}); }); sealed = null; changed("The whole look is in your capsule"); }
  else if (t.dataset.remove) remove(t.dataset.remove);
  else if (t.dataset.move) { const i = +t.dataset.move; move(i, i + +t.dataset.dir); const b = document.querySelector(`[data-move="${i + +t.dataset.dir}"][data-dir="${t.dataset.dir}"]`); (b && !b.disabled ? b : document.querySelector(`[data-move="${i + +t.dataset.dir}"]`))?.focus(); }
  else if ("undo" in t.dataset) { capsule.splice(removed.index, 0, removed.item); removed = null; changed("Restored to your capsule"); }
  else if ("reopen" in t.dataset) { sealed = null; render(false); }
});
document.addEventListener("input", e => {
  const id = e.target.dataset?.note; if (!id) return;
  const it = capsule.find(x => x.id === id); if (it) { it.note = e.target.value; save(); }
  e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px";
});
document.addEventListener("submit", e => {
  if (e.target.id !== "seal") return; e.preventDefault();
  const n = $("#seal-name"), m = $("#seal-email");
  const okN = n.value.trim().length > 1, okM = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m.value.trim());
  n.nextElementSibling.hidden = okN; m.nextElementSibling.hidden = okM;
  n.setAttribute("aria-invalid", !okN); m.setAttribute("aria-invalid", !okM);
  if (!okN) return n.focus(); if (!okM) return m.focus();
  sealed = { name: n.value.trim() }; render(false); toast("Capsule sealed");
});
function bindDrag(){
  const list = $("#archive"); if (!list) return; let from = null;
  list.querySelectorAll(".entry").forEach(li => {
    li.addEventListener("dragstart", e => { from = +li.dataset.i; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", from); } catch(_) {} });
    li.addEventListener("dragend", () => { li.classList.remove("dragging"); list.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
    li.addEventListener("dragover", e => { e.preventDefault(); li.classList.add("over"); });
    li.addEventListener("dragleave", () => li.classList.remove("over"));
    li.addEventListener("drop", e => { e.preventDefault(); const to = +li.dataset.i; if (from !== null) move(from, to); from = null; });
  });
}
window.addEventListener("hashchange", () => { removed = null; render(true); });

load(); $("#count").textContent = capsule.length; render(true);
</script>
